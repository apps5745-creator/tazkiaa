  <script>
    const openLesson = document.getElementById("openLesson");
    const lessonContent = document.getElementById("lessonContent");
    const lessons = document.getElementById("lessons");
    const backToLessons = document.getElementById("backToLessons");

    const questions = [
      {
        q: "ما الموضوع الأساسي لعلم التوحيد؟",
        a: [
          "العقائد الإسلامية",
          "الحساب والهندسة",
          "قواعد الإملاء"
        ],
        c: 0,
        hint: "فكّر في العلم الذي يدرس أصول العقيدة."
      },
      {
        q: "من فوائد دراسة علم التوحيد:",
        a: [
          "تعلم العمليات الحسابية",
          "فهم أصول العقيدة",
          "تعلم قواعد المرور"
        ],
        c: 1,
        hint: "العلم يساعدنا على فهم العقيدة وأدلتها."
      }
    ];

    let index = 0;
    let score = 0;
    let answered = false;

    const quiz = document.getElementById("quiz");
    const feedback = document.getElementById("feedback");
    const next = document.getElementById("next");
    const restart = document.getElementById("restart");

    // فتح الدرس وإعادة تشغيل الاختبار تلقائياً
    openLesson.addEventListener("click", function () {
      lessons.hidden = true;
      lessonContent.hidden = false;
      resetAndStartQuiz(); // تشغيل الاختبار من البداية عند فتح الدرس
      window.scrollTo(0, 0);
    });

    // العودة للدروس
    backToLessons.addEventListener("click", function () {
      lessonContent.hidden = true;
      lessons.hidden = false;
      window.scrollTo(0, 0);
    });

    // دالة لإعادة ضبط البيانات وتحديث الأسئلة
    function resetAndStartQuiz() {
      index = 0;
      score = 0;
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      feedback.textContent = "";
      next.hidden = true;
      restart.hidden = true;
      quiz.innerHTML = "";

      if (index >= questions.length) {
        const result = document.createElement("h3");
        result.textContent =
          "🎉 انتهى الاختبار! نتيجتك: " +
          score + " من " + questions.length;

        quiz.appendChild(result);
        restart.hidden = false;
        return;
      }

      const item = questions[index];
      const title = document.createElement("h3");

      title.textContent =
        "السؤال " + (index + 1) + ": " + item.q;

      quiz.appendChild(title);

      item.a.forEach(function (text, i) {
        const btn = document.createElement("button");

        btn.className = "answer";
        btn.textContent = text;

        btn.addEventListener("click", function () {
          chooseAnswer(i, btn);
        });

        quiz.appendChild(btn);
      });
    }

    function chooseAnswer(choice, selected) {
      if (answered) return;

      answered = true;
      const item = questions[index];
      const buttons = quiz.querySelectorAll(".answer");

      buttons.forEach(function (btn, i) {
        btn.disabled = true;

        if (i === item.c) {
          btn.classList.add("correct");
        }
      });

      if (choice === item.c) {
        score++;
        feedback.textContent = "أحسنت! إجابة صحيحة ⭐";
        feedback.style.color = "#176b63";
      } else {
        selected.classList.add("wrong");
        feedback.textContent =
          "حاول مرة أخرى. " + item.hint;
        feedback.style.color = "#a34e42";
      }

      next.hidden = false;
      next.textContent =
        index === questions.length - 1
          ? "عرض النتيجة"
          : "السؤال التالي ←";
    }

    next.addEventListener("click", function () {
      index++;
      renderQuestion();
    });

    restart.addEventListener("click", function () {
      resetAndStartQuiz();
    });
  </script>
